name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  linux:
    name: linux (${{ matrix.system }}, ${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        system: [autotools, cmake]
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libncurses-dev clang cmake
      - name: Build (autotools)
        if: matrix.system == 'autotools'
        env:
          CC: ${{ matrix.cc }}
        run: |
          autoreconf -i
          ./configure
          make
      - name: Build (cmake)
        if: matrix.system == 'cmake'
        run: |
          mkdir build && cd build
          cmake -DCMAKE_C_COMPILER=${{ matrix.cc }} ..
          make
          cp wmatrix ..
      - name: Smoke test
        run: ./wmatrix -V

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-ncurses
      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:PATH"
          ./build.ps1
      - name: Smoke test
        shell: pwsh
        run: ./wmatrix.exe -V
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/wmatrix | Out-Null
          Copy-Item wmatrix.exe, libncursesw6.dll, install.ps1, README.md, COPYING dist/wmatrix/
          Compress-Archive -Path dist/wmatrix/* -DestinationPath wmatrix-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: wmatrix-windows-x64
          path: wmatrix-windows-x64.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: wmatrix-windows-x64.zip
